<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8ee">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Rumeysa Kor için sevgiyle hazırlanmış bir doğum günü sürprizi.">
<title>İyi ki doğdun Rumeysa! 🎈</title>
<style>
:root{color-scheme:light;--paper:#fff8ee;--ink:#542534;--pink:#b83d61}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100svh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 8% 16%,#f9dbcb80,transparent 50%),radial-gradient(ellipse at 100% 90%,#e1ded780,transparent 45%)}
.balloons{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}.balloon{position:absolute;bottom:-210px;left:var(--x);width:var(--size);height:calc(var(--size)*1.22);border-radius:50% 50% 46% 46%;background:radial-gradient(ellipse at 30% 25%,#ffffff99,transparent 36%),var(--color);box-shadow:inset -8px -5px 14px #0000000b;animation:float var(--duration) linear infinite;animation-delay:var(--delay);opacity:.8}
.balloon::before{content:"";position:absolute;bottom:-7px;left:calc(50% - 5px);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid var(--color)}
.balloon::after{content:"";position:absolute;top:calc(100% + 7px);left:50%;width:18px;height:100px;border-left:1px solid #8b756c66;border-radius:50%}
@keyframes float{0%{transform:translate3d(0,0,0) rotate(-8deg)}50%{transform:translate3d(22px,-65vh,0) rotate(8deg)}100%{transform:translate3d(-12px,calc(-100vh - 330px),0) rotate(-8deg)}}
.page{position:relative;z-index:1;max-width:1120px;margin:auto;padding:30px 54px 24px}.topline{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid #54253422;font-size:11px;letter-spacing:.19em;text-transform:uppercase}.topline span:nth-child(2){font-size:23px;color:var(--pink)}
main{display:grid;grid-template-columns:1.05fr 1fr;gap:65px;align-items:center;padding:62px 0 46px}.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#94596a;display:flex;gap:10px;align-items:center}.eyebrow::before{content:"";height:1px;width:30px;background:currentColor}
h1{font:normal clamp(3.8rem,6.8vw,5.6rem)/1.02 Georgia,"Times New Roman",serif;letter-spacing:-.055em;margin:24px 0}h1 em{font-weight:normal;color:var(--pink)}.message{font-size:16px;line-height:1.85;max-width:350px;color:#785b60;margin:0 0 28px}.signature{font:italic 23px Georgia,serif;margin:0 0 32px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px}button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:14px 21px;font-size:13px;font-weight:600;background:var(--pink);color:#fff8ee;transition:background .2s}button:hover{background:#95304d}button:focus-visible{outline:3px solid #407e87;outline-offset:4px}.motion{background:transparent;color:#785b60;font-weight:400;font-size:12px;padding:12px 7px}.motion:hover{background:#5425340a}
figure{margin:0;position:relative;transform:rotate(3deg);padding:13px 13px 19px;background:#fffefa;box-shadow:0 15px 50px #54253416,0 2px 7px #5425340a;border:1px solid #5425340c}figure::before{content:"";position:absolute;z-index:1;top:-15px;left:calc(50% - 45px);width:90px;height:30px;background:#e6c89c88;transform:rotate(-6deg)}img{display:block;width:100%;height:auto}figcaption{text-align:center;font:italic 19px Georgia,serif;padding-top:18px;color:#85606a}.spark{position:absolute;right:-24px;top:-40px;font-size:62px;line-height:1;color:#c4984d;transform:rotate(-12deg)}
footer{border-top:1px solid #54253422;padding-top:20px;text-align:center;font-size:11px;letter-spacing:.12em;color:#94777a}.paused .balloon{animation-play-state:paused}.status{min-height:20px;color:#94596a;font-size:12px;margin-top:12px}
@media(min-width:1300px){.page{padding-top:46px}main{padding-top:80px;padding-bottom:60px}}
@media(max-width:700px){.page{padding:20px 26px}.topline{font-size:9px;padding-bottom:16px}main{grid-template-columns:1fr;gap:38px;padding:38px 0 30px}.copy{text-align:center}.eyebrow{justify-content:center}h1{font-size:clamp(3.5rem,13vw,5rem);margin:20px 0}.message{margin:0 auto 22px;font-size:15px}.signature{margin-bottom:24px}.actions{justify-content:center}figure{width:min(100%,390px);justify-self:center;transform:rotate(2deg)}.spark{right:-12px;top:-26px;font-size:45px}.balloon{opacity:.5}footer{font-size:10px;line-height:1.7}}
@media(prefers-reduced-motion:reduce){.balloon{animation:none;display:none}button{transition:none}}
</style>
</head>
<body>
<div class="balloons" aria-hidden="true"></div>
<div class="page">
<header class="topline"><span>Bugün senin günün</span><span aria-hidden="true">✧</span><span>Rumeysa Kor</span></header>
<main>
<section class="copy" aria-labelledby="birthday-title">
<div class="eyebrow">Sana küçük bir sürpriz</div>
<h1 id="birthday-title">İyi ki doğdun<br> <em>Rumeysa!</em></h1>
<p class="message">Yeni yaşın; bol kahkaha, güzel anılar ve kalbinden geçen tüm güzelliklerle dolsun.</p>
<p class="signature">Nice güzel yaşlara, birlikte… ♡</p>
<div class="actions"><button id="celebrate" type="button">Bir dilek tut 🎈</button><button class="motion" id="motion" type="button" aria-pressed="false">Balonları duraklat</button></div>
<div class="status" role="status" aria-live="polite" id="status"></div>
</section>
<figure><span class="spark" aria-hidden="true">✧</span><img src="assets/rumeysa-kor.png" width="640" height="640" alt="Deniz kenarında birlikte çekilmiş grup fotoğrafı" fetchpriority="high"><figcaption>Birlikte daha nice güzel anılara.</figcaption></figure>
</main>
<footer>Senin için, sevgiyle hazırlandı. <span aria-hidden="true">♡</span></footer>
</div>
<script>
const layer = document.querySelector('.balloons');
const colors = ['#e591a6','#e6bd68','#85bcb8','#aea0ce','#e6a07e','#8baed2'];
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
function balloon(index, burst = false) {
  const element = document.createElement('span');
  element.className = 'balloon';
  element.style.cssText = `--x:${Math.random()*96}%;--size:${36+Math.random()*28}px;--color:${colors[index%colors.length]};--duration:${burst?7+Math.random()*4:15+Math.random()*12}s;--delay:${burst?0:-Math.random()*28}s`;
  if (burst) {
    element.style.animationIterationCount = '1';
    element.addEventListener('animationend', () => element.remove(), {once:true});
  }
  layer.append(element);
}
for (let i=0; i<15; i++) balloon(i);
document.querySelector('#celebrate').addEventListener('click', () => {
  document.querySelector('#status').textContent = 'Dileğin gerçek olsun. İyi ki varsın Rumeysa! ♡';
  if (!reducedMotion.matches && !document.body.classList.contains('paused') && layer.childElementCount < 55) {
    for (let i=0; i<18; i++) balloon(i, true);
  }
});
const motionButton = document.querySelector('#motion');
motionButton.addEventListener('click', () => {
  const paused = document.body.classList.toggle('paused');
  motionButton.setAttribute('aria-pressed', String(paused));
  motionButton.textContent = paused ? 'Balonları devam ettir' : 'Balonları duraklat';
});
function updateMotionPreference() { motionButton.hidden = reducedMotion.matches; }
reducedMotion.addEventListener('change', updateMotionPreference);
updateMotionPreference();
</script>
</body>
</html>
